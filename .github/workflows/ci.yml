name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/inside_the_game?schema=public
      ADMIN_TOKEN: ci-admin-token
      ADMIN_PASSWORD: ci-admin-password
      AI_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inside_the_game
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Prisma's generated client type is needed by every workspace typecheck.
      - run: npm run generate -w @inside/database
      - run: npm run typecheck
      - run: npm run test
      - run: npm run lint
      - run: npm run build -w @inside/web -w @inside/admin
